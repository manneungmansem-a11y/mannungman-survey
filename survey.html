<!DOCTYPE html>
<html lang="ko" translate="no">
<head>
  <meta charset="UTF-8">
  <meta name="google" content="notranslate">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>만능맨 베타테스트 피드백 설문</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html { scroll-behavior: smooth; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Noto Sans KR', 'Segoe UI', sans-serif;
      background-color: #f0f4f8;
      background-image: url('백그라운드배경/백그라운드.png');
      background-size: cover;
      background-attachment: fixed;
      background-position: center center;
      background-repeat: no-repeat;
      color: #1e293b;
      font-size: 16px;
      line-height: 1.65;
    }

    /* ── 진행률 바 ── */
    #progress-bar-wrap {
      position: fixed;
      top: 0; left: 0; right: 0;
      z-index: 100;
      background: rgba(240, 244, 248, 0.97);
      backdrop-filter: blur(6px);
      -webkit-backdrop-filter: blur(6px);
      box-shadow: 0 1px 4px rgba(0,0,0,.08);
    }
    #progress-bar-inner {
      display: flex;
      align-items: center;
      max-width: 720px;
      margin: 0 auto;
      padding: 10px 16px;
      gap: 12px;
    }
    #header-info-bar {
      max-width: 720px;
      margin: 0 auto;
      padding: 6px 16px 8px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      border-top: 1px solid rgba(0,0,0,.06);
    }
    .header-phone {
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: 14px;
      font-weight: 700;
      color: #1a56db;
      text-decoration: none;
      white-space: nowrap;
    }
    .header-phone:hover { color: #1240a8; }
    .header-phone svg { flex-shrink: 0; }
    .partners-btn {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      padding: 5px 13px;
      background: #1a56db;
      color: #fff;
      font-size: 13px;
      font-weight: 700;
      border-radius: 99px;
      text-decoration: none;
      white-space: nowrap;
      transition: background .2s;
    }
    .partners-btn:hover { background: #1240a8; }
    .logo-img {
      height: 48px;
      width: auto;
      max-width: 160px;
      object-fit: contain;
      flex-shrink: 0;
    }
    #progress-track {
      flex: 1;
      height: 8px;
      background: #e2e8f0;
      border-radius: 99px;
      overflow: hidden;
    }
    #progress-fill {
      height: 100%;
      background: linear-gradient(90deg, #1a56db, #3b82f6);
      border-radius: 99px;
      width: 0%;
      transition: width .4s ease;
    }
    #progress-label {
      font-size: 13px;
      color: #64748b;
      white-space: nowrap;
      flex-shrink: 0;
    }

    /* ── 배너 섹션 ── */
    #banner-section {
      background: #fff;
      width: 100%;
      padding-top: 104px;
      position: relative;
    }
    #banner-section::after {
      content: '';
      position: absolute;
      bottom: -30px;
      left: 0; right: 0;
      height: 30px;
      background: linear-gradient(to bottom, #fff 0%, transparent 100%);
      pointer-events: none;
      z-index: 3;
    }
    .banner-inner {
      max-width: 720px;
      margin: 0 auto;
      padding: 16px 16px 18px;
    }
    .banner-wrap { position: relative; margin-bottom: 0; line-height: 0; }
    .banner-img {
      width: 100%;
      height: auto;
      display: block;
      object-fit: cover;
      border-radius: 14px;
      box-shadow: 0 4px 16px rgba(0,0,0,.12);
    }

    /* ════════════════════════════════
       참여 유형 선택 화면
    ════════════════════════════════ */
    #entry-screen {
      display: none;
      max-width: 720px;
      margin: 0 auto;
      padding: 30px 16px 60px;
      position: relative;
      z-index: 2;
    }
    .entry-intro {
      text-align: center;
      margin-bottom: 28px;
    }
    .entry-intro h2 {
      font-size: 22px;
      font-weight: 800;
      color: #1e293b;
      margin-bottom: 8px;
    }
    .entry-intro p {
      font-size: 15px;
      color: #64748b;
      line-height: 1.7;
    }
    .entry-cards {
      display: flex;
      flex-direction: column;
      gap: 14px;
    }
    .entry-card {
      background: rgba(255,255,255,.93);
      border: 2px solid #e2e8f0;
      border-radius: 16px;
      padding: 22px 24px;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 18px;
      transition: border-color .2s, box-shadow .2s, transform .15s;
      box-shadow: 0 2px 10px rgba(0,0,0,.06);
      backdrop-filter: blur(4px);
      -webkit-backdrop-filter: blur(4px);
    }
    .entry-card:hover {
      border-color: #1a56db;
      box-shadow: 0 4px 20px rgba(26,86,219,.16);
      transform: translateY(-2px);
    }
    .entry-card:active { transform: translateY(0); }
    .entry-card-icon {
      width: 56px;
      height: 56px;
      border-radius: 14px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 26px;
      flex-shrink: 0;
    }
    .entry-card-icon.blue   { background: #eff6ff; }
    .entry-card-icon.green  { background: #f0fdf4; }
    .entry-card-icon.purple { background: #faf5ff; }
    .entry-card-body { flex: 1; min-width: 0; }
    .entry-card-title {
      font-size: 17px;
      font-weight: 800;
      color: #1e293b;
      margin-bottom: 4px;
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .entry-lock-badge {
      display: inline-flex;
      align-items: center;
      gap: 3px;
      font-size: 11px;
      font-weight: 600;
      padding: 2px 7px;
      border-radius: 99px;
      background: #fef9c3;
      color: #92400e;
      border: 1px solid #fde68a;
    }
    .entry-card-desc {
      font-size: 14px;
      color: #64748b;
      line-height: 1.55;
    }
    .entry-card-arrow {
      font-size: 20px;
      color: #cbd5e1;
      flex-shrink: 0;
      transition: color .2s;
    }
    .entry-card:hover .entry-card-arrow { color: #1a56db; }

    /* ════════════════════════════════
       비밀코드 모달
    ════════════════════════════════ */
    #code-modal-overlay {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,.5);
      z-index: 300;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }
    #code-modal-overlay.visible { display: flex; }
    .code-modal {
      background: #fff;
      border-radius: 18px;
      padding: 32px 28px 28px;
      width: 100%;
      max-width: 380px;
      box-shadow: 0 8px 40px rgba(0,0,0,.22);
      text-align: center;
      position: relative;
    }
    .code-modal-icon {
      width: 56px; height: 56px;
      background: #eff6ff;
      border-radius: 50%;
      display: flex; align-items: center; justify-content: center;
      margin: 0 auto 16px;
      font-size: 26px;
    }
    .code-modal h3 {
      font-size: 18px;
      font-weight: 800;
      color: #1e293b;
      margin-bottom: 6px;
    }
    .code-modal-desc {
      font-size: 14px;
      color: #64748b;
      margin-bottom: 20px;
      line-height: 1.6;
    }
    .code-input {
      width: 100%;
      padding: 13px 16px;
      border: 1.5px solid #e2e8f0;
      border-radius: 10px;
      font-size: 17px;
      text-align: center;
      letter-spacing: 4px;
      outline: none;
      transition: border-color .2s;
      font-family: inherit;
    }
    .code-input:focus { border-color: #1a56db; }
    .code-modal-error {
      margin-top: 8px;
      font-size: 13px;
      color: #dc2626;
      min-height: 20px;
    }
    .code-modal-btns {
      display: flex;
      gap: 10px;
      margin-top: 16px;
    }
    .btn-code-cancel {
      flex: 1;
      padding: 12px;
      background: #f1f5f9;
      color: #64748b;
      border: none;
      border-radius: 8px;
      font-size: 15px;
      font-weight: 600;
      cursor: pointer;
      transition: background .15s;
    }
    .btn-code-cancel:hover { background: #e2e8f0; }
    .btn-code-confirm {
      flex: 2;
      padding: 12px;
      background: #1a56db;
      color: #fff;
      border: none;
      border-radius: 8px;
      font-size: 15px;
      font-weight: 700;
      cursor: pointer;
      transition: background .15s;
    }
    .btn-code-confirm:hover { background: #1e40af; }
    .btn-code-confirm:disabled { background: #94a3b8; cursor: not-allowed; }

    /* ── 메인 래퍼 ── */
    #survey-page {
      display: none;
      max-width: 720px;
      margin: 0 auto;
      padding: 30px 16px 60px;
      position: relative;
      z-index: 2;
    }
    #complete-page {
      display: none;
      max-width: 720px;
      margin: 0 auto;
      padding: 80px 16px 60px;
    }

    /* ── 카드 ── */
    .card {
      background: rgba(255,255,255,.88);
      border-radius: 14px;
      box-shadow: 0 2px 12px rgba(0,0,0,.10);
      margin-bottom: 18px;
      overflow: hidden;
      backdrop-filter: blur(4px);
      -webkit-backdrop-filter: blur(4px);
    }

    /* ── 섹션 카드 ── */
    .section-card .section-header {
      background: #1a56db;
      padding: 14px 24px;
      display: flex;
      align-items: center;
      gap: 10px;
    }
    .section-card .section-num {
      background: rgba(255,255,255,.2);
      color: #fff;
      font-size: 12px;
      font-weight: 700;
      padding: 2px 8px;
      border-radius: 99px;
    }
    .section-card .section-title {
      color: #fff;
      font-size: 16px;
      font-weight: 700;
    }
    .section-card .section-body { padding: 8px 24px 24px; }

    /* ── 유형 배지 ── */
    .type-badge {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 4px 12px;
      border-radius: 99px;
      font-size: 13px;
      font-weight: 700;
      margin-bottom: 4px;
    }
    .type-badge.general  { background: #eff6ff; color: #1a56db; border: 1px solid #bfdbfe; }
    .type-badge.employee { background: #f0fdf4; color: #15803d; border: 1px solid #bbf7d0; }
    .type-badge.partner  { background: #faf5ff; color: #7c3aed; border: 1px solid #ddd6fe; }

    /* ── 질문 블록 ── */
    .q-block {
      margin-top: 22px;
      padding-top: 22px;
      border-top: 1px solid #f1f5f9;
    }
    .q-block:first-child { border-top: none; }
    .q-label {
      font-size: 15.5px;
      font-weight: 600;
      color: #1e293b;
      margin-bottom: 12px;
      line-height: 1.5;
    }
    .req {
      display: inline-block;
      background: #dc2626;
      color: #fff;
      font-size: 11px;
      font-weight: 700;
      padding: 2px 7px;
      border-radius: 99px;
      margin-left: 6px;
      vertical-align: middle;
    }
    .multi-hint {
      font-size: 13px;
      color: #64748b;
      font-weight: 400;
      margin-left: 6px;
    }

    /* ── 토스트 팝업 ── */
    #validation-toast {
      position: fixed;
      bottom: 24px;
      right: 16px;
      z-index: 200;
      background: #fff;
      border: 1.5px solid #fca5a5;
      border-radius: 14px;
      box-shadow: 0 4px 24px rgba(0,0,0,.18);
      padding: 14px 16px;
      max-width: 260px;
      width: calc(100% - 32px);
      display: none;
      animation: toastIn .25s ease;
    }
    #validation-toast.visible { display: block; }
    @keyframes toastIn {
      from { opacity: 0; transform: translateY(10px); }
      to   { opacity: 1; transform: translateY(0); }
    }
    .toast-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 10px;
    }
    .toast-header-text { font-size: 13px; font-weight: 700; color: #b91c1c; }
    .toast-close-btn {
      cursor: pointer; font-size: 15px; color: #94a3b8;
      line-height: 1; padding: 2px 4px; border: none; background: none;
    }
    .toast-close-btn:hover { color: #475569; }
    .toast-list { display: flex; flex-wrap: wrap; gap: 6px; }
    .toast-item {
      background: #fef2f2;
      border: 1.5px solid #fca5a5;
      color: #b91c1c;
      font-size: 12.5px;
      font-weight: 700;
      padding: 4px 10px;
      border-radius: 99px;
      cursor: pointer;
      transition: background .15s;
    }
    .toast-item:hover { background: #fee2e2; }

    /* ── 라디오 선택지 ── */
    .radio-group { display: flex; flex-direction: column; gap: 8px; }
    .radio-option {
      display: flex;
      align-items: center;
      gap: 10px;
      cursor: pointer;
      padding: 11px 14px;
      border-radius: 8px;
      border: 1.5px solid #e2e8f0;
      transition: border-color .15s, background .15s;
      user-select: none;
    }
    .radio-option:hover { border-color: #93c5fd; background: #f0f9ff; }
    .radio-dot {
      width: 18px; height: 18px;
      border-radius: 50%;
      border: 2px solid #cbd5e1;
      background: #fff;
      flex-shrink: 0;
      display: flex; align-items: center; justify-content: center;
      transition: border-color .15s, background .15s;
    }
    .radio-dot::after {
      content: '';
      width: 8px; height: 8px;
      border-radius: 50%;
      background: #fff;
      display: none;
    }
    .radio-option.selected { border-color: #1a56db; background: #eff6ff; }
    .radio-option.selected .radio-dot { border-color: #1a56db; background: #1a56db; }
    .radio-option.selected .radio-dot::after { display: block; }
    .radio-option .option-text { font-size: 15px; color: #374151; }

    /* ── 체크박스 선택지 ── */
    .checkbox-group { display: flex; flex-direction: column; gap: 8px; }
    .checkbox-option {
      display: flex;
      align-items: center;
      gap: 10px;
      cursor: pointer;
      padding: 11px 14px;
      border-radius: 8px;
      border: 1.5px solid #e2e8f0;
      transition: border-color .15s, background .15s;
      user-select: none;
    }
    .checkbox-option:hover { border-color: #93c5fd; background: #f0f9ff; }
    .checkbox-box {
      width: 18px; height: 18px;
      border-radius: 4px;
      border: 2px solid #cbd5e1;
      background: #fff;
      flex-shrink: 0;
      display: flex; align-items: center; justify-content: center;
      transition: border-color .15s, background .15s;
    }
    .checkbox-box::after {
      content: '';
      width: 10px; height: 7px;
      border-left: 2.5px solid #fff;
      border-bottom: 2.5px solid #fff;
      transform: rotate(-45deg) translate(1px, -1px);
      display: none;
    }
    .checkbox-option.checked { border-color: #1a56db; background: #eff6ff; }
    .checkbox-option.checked .checkbox-box { border-color: #1a56db; background: #1a56db; }
    .checkbox-option.checked .checkbox-box::after { display: block; }
    .checkbox-option .option-text { font-size: 15px; color: #374151; }

    /* ── 척도형 ── */
    .scale-group {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }
    .scale-row {
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .scale-labels {
      display: flex;
      justify-content: space-between;
      font-size: 12px;
      color: #94a3b8;
      padding: 0 2px;
    }
    .scale-options {
      display: flex;
      gap: 8px;
      flex: 1;
    }
    .scale-option {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 5px;
      cursor: pointer;
      padding: 10px 4px;
      border-radius: 8px;
      border: 1.5px solid #e2e8f0;
      transition: border-color .15s, background .15s;
      user-select: none;
      min-width: 0;
    }
    .scale-option:hover { border-color: #93c5fd; background: #f0f9ff; }
    .scale-option .scale-num {
      font-size: 15px;
      font-weight: 700;
      color: #64748b;
    }
    .scale-dot {
      width: 14px; height: 14px;
      border-radius: 50%;
      border: 2px solid #cbd5e1;
      background: #fff;
      transition: border-color .15s, background .15s;
    }
    .scale-option.selected { border-color: #1a56db; background: #eff6ff; }
    .scale-option.selected .scale-num { color: #1a56db; }
    .scale-option.selected .scale-dot { border-color: #1a56db; background: #1a56db; }

    /* ── 텍스트 입력 ── */
    .text-input, .textarea-input {
      width: 100%;
      border: 1.5px solid #e2e8f0;
      border-radius: 8px;
      padding: 11px 14px;
      font-size: 15px;
      font-family: inherit;
      color: #1e293b;
      background: #fff;
      transition: border-color .2s;
      outline: none;
      resize: vertical;
    }
    .text-input:focus, .textarea-input:focus { border-color: #1a56db; }
    .textarea-input { min-height: 120px; }

    /* ── 제출 버튼 ── */
    .submit-area { margin-top: 10px; }
    .btn-submit {
      width: 100%;
      padding: 16px;
      background: #1a56db;
      color: #fff;
      border: none;
      border-radius: 10px;
      font-size: 17px;
      font-weight: 700;
      cursor: pointer;
      transition: background .2s, transform .1s;
      letter-spacing: .3px;
    }
    .btn-submit:hover { background: #1e40af; }
    .btn-submit:active { transform: scale(.98); }
    .btn-submit:disabled { background: #94a3b8; cursor: not-allowed; }

    /* ── 오류 안내 ── */
    .error-msg {
      background: #fef2f2;
      border: 1.5px solid #fca5a5;
      color: #b91c1c;
      border-radius: 8px;
      padding: 12px 14px;
      font-size: 14px;
      margin-top: 12px;
      display: none;
    }
    .error-msg.visible { display: block; }
    .q-block.error-field .q-label { color: #dc2626; }
    .q-block.error-field .radio-group,
    .q-block.error-field .checkbox-group,
    .q-block.error-field .scale-options,
    .q-block.error-field .text-input,
    .q-block.error-field .textarea-input {
      outline: 2px solid #f87171;
      border-radius: 8px;
    }

    /* ── 완료 화면 ── */
    .complete-card {
      border-top: 5px solid #16a34a;
      padding: 48px 28px 40px;
      text-align: center;
    }
    .complete-icon {
      width: 64px; height: 64px;
      background: #dcfce7;
      border-radius: 50%;
      display: flex; align-items: center; justify-content: center;
      margin: 0 auto 20px;
      font-size: 32px;
    }
    .complete-card h2 { font-size: 22px; font-weight: 800; color: #1e293b; margin-bottom: 12px; }
    .complete-card p { font-size: 16px; color: #64748b; line-height: 1.8; }

    /* ── 로딩 오버레이 ── */
    #loading-overlay {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(255,255,255,.85);
      z-index: 999;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 16px;
    }
    #loading-overlay.visible { display: flex; }
    .spinner {
      width: 44px; height: 44px;
      border: 4px solid #e2e8f0;
      border-top-color: #1a56db;
      border-radius: 50%;
      animation: spin .8s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    #loading-overlay span { font-size: 15px; color: #64748b; }

    /* ── 개인정보 동의 ── */
    .privacy-box {
      background: #f8fafc;
      border: 1.5px solid #e2e8f0;
      border-radius: 10px;
      padding: 16px;
      margin-bottom: 14px;
      font-size: 14px;
      color: #475569;
      line-height: 1.7;
    }
    .consent-label {
      display: flex;
      align-items: center;
      gap: 10px;
      cursor: pointer;
      font-size: 15px;
      font-weight: 600;
      color: #1e293b;
      padding: 12px 14px;
      border-radius: 8px;
      border: 1.5px solid #e2e8f0;
      transition: border-color .15s, background .15s;
      user-select: none;
    }
    .consent-label:hover { border-color: #93c5fd; background: #f0f9ff; }
    .consent-label.checked { border-color: #1a56db; background: #eff6ff; }
    .consent-cb {
      width: 18px; height: 18px;
      border-radius: 4px;
      border: 2px solid #cbd5e1;
      background: #fff;
      flex-shrink: 0;
      display: flex; align-items: center; justify-content: center;
      transition: border-color .15s, background .15s;
    }
    .consent-cb::after {
      content: '';
      width: 10px; height: 7px;
      border-left: 2.5px solid #fff;
      border-bottom: 2.5px solid #fff;
      transform: rotate(-45deg) translate(1px, -1px);
      display: none;
    }

function init() {

  showEntry();
}

function showEntry() {
  document.getElementById('entry-screen').style.display = 'block';
  document.getElementById('survey-page').style.display = 'none';
  document.getElementById('complete-page').style.display = 'none';
  document.getElementById('banner-section').style.display = 'block';

// ════════════════════════════════════════════════════════
// 유형 선택
// ════════════════════════════════════════════════════════
function selectType(type) {
  if (type === 'general') {
    enterSurvey('general');
  } else {
    pendingType = type;
    openCodeModal(type);
  }
}

// ════════════════════════════════════════════════════════
// 비밀코드 모달
// ════════════════════════════════════════════════════════
function openCodeModal(type) {
  const labels = { employee: '임직원', partner: '파트너' };
  document.getElementById('code-modal-title').textContent = labels[type] + ' 비밀코드 입력';
  document.getElementById('code-modal-desc').textContent = labels[type] + ' 참여자 전용 비밀코드를 입력해주세요.';
  document.getElementById('code-input').value = '';
  document.getElementById('code-modal-error').textContent = '';
  document.getElementById('btn-code-confirm').disabled = false;
  document.getElementById('code-modal-overlay').classList.add('visible');
  setTimeout(() => document.getElementById('code-input').focus(), 100);
}

function closeCodeModal() {
  document.getElementById('code-modal-overlay').classList.remove('visible');
  pendingType = null;
}

document.getElementById('code-input').addEventListener('keydown', function(e) {
  if (e.key === 'Enter') confirmCode();
});

async function confirmCode() {
  const code = document.getElementById('code-input').value.trim();
  if (!code) {
    document.getElementById('code-modal-error').textContent = '비밀코드를 입력해주세요.';
    return;
  }

  const btn = document.getElementById('btn-code-confirm');
  btn.disabled = true;
  btn.textContent = '확인 중...';
  document.getElementById('code-modal-error').textContent = '';

  try {
    const res = await fetch(`${SCRIPT_URL}?action=validateCode&type=${pendingType}&code=${encodeURIComponent(code)}`);
    const json = await res.json();
    if (json.valid) {
      document.getElementById('code-modal-overlay').classList.remove('visible');
      enterSurvey(pendingType);
      pendingType = null;
    } else {
      document.getElementById('code-modal-error').textContent = '비밀코드가 올바르지 않습니다. 다시 확인해주세요.';
      document.getElementById('code-input').value = '';
      document.getElementById('code-input').focus();
    }
  } catch (_) {
    // 서버 연결 실패 시 진입 차단
    document.getElementById('code-modal-error').textContent = '서버 연결 오류가 발생했습니다. 잠시 후 다시 시도해주세요.';
  } finally {
    btn.disabled = false;
    btn.textContent = '확인';
  }
}

// ════════════════════════════════════════════════════════
// 설문 렌더링
// ════════════════════════════════════════════════════════
function enterSurvey(type) {
  currentType = type;
  renderSurveyByType(type);
  document.getElementById('entry-screen').style.display = 'none';
  document.getElementById('survey-page').style.display = 'block';
  document.getElementById('progress-track').style.display = 'block';
  window.scrollTo({ top: 0, behavior: 'smooth' });
}

function renderSurveyByType(type) {
  const questions = questionsByType[type];
  const typeLabels = { general: '일반 사용자', employee: '임직원', partner: '파트너' };
  const typeClasses = { general: 'general', employee: 'employee', partner: 'partner' };
  const icons = { general: '👤', employee: '🏢', partner: '🔧' };

  // 유형 배지
  document.getElementById('survey-type-badge').innerHTML =
    `<span class="type-badge ${typeClasses[type]}">${icons[type]} ${typeLabels[type]} 설문 (총 ${questions.length}문항)</span>`;

  const container = document.getElementById('survey-questions');
  container.innerHTML = '';

  // 섹션 없이 단일 카드로 구성 (유형별 묶음)
  const card = document.createElement('div');
  card.className = 'card section-card';

  const header = document.createElement('div');
  header.className = 'section-header';
  header.innerHTML = `<span class="section-num">설문</span><span class="section-title">${typeLabels[type]} 설문지</span>`;

  const body = document.createElement('div');
  body.className = 'section-body';

  questions.forEach((q, idx) => {
    const block = buildQuestionBlock(q, idx);
    body.appendChild(block);
  });

  card.appendChild(header);
  card.appendChild(body);
  container.appendChild(card);

  initChoiceUI();
  initSpecialInputs();
  updateProgress();
}

// ── 질문 블록 생성 ──
function buildQuestionBlock(q, idx) {
  const block = document.createElement('div');
  block.className = 'q-block';
  block.id = 'qb-' + q.id;

  const label = document.createElement('div');
  label.className = 'q-label';

  const isMulti = q.type === 'checkbox';
  const multiHint = isMulti ? '<span class="multi-hint">(복수 선택 가능)</span>' : '';
  label.innerHTML = `${q.title}<span class="req">필수</span>${multiHint}`;
  block.appendChild(label);

  if (q.type === 'name') {
    const input = document.createElement('input');
    input.type = 'text';
    input.className = 'text-input';
    input.dataset.colKey = q.colKey;
    input.dataset.required = 'true';
    input.dataset.inputType = 'name';
    input.placeholder = '이름을 입력해주세요.';
    input.autocomplete = 'off';
    block.appendChild(input);
  } else if (q.type === 'phone') {
    const input = document.createElement('input');
    input.type = 'text';
    input.className = 'text-input';
    input.dataset.colKey = q.colKey;
    input.dataset.required = 'true';
    input.dataset.inputType = 'phone';
    input.placeholder = '예: 010-0000-0000';
    input.autocomplete = 'off';
    block.appendChild(input);
  } else if (q.type === 'text') {
    const input = document.createElement('input');
    input.type = 'text';
    input.className = 'text-input';
    input.dataset.colKey = q.colKey;
    input.dataset.required = 'true';
    if (q.placeholder) input.placeholder = q.placeholder;
    block.appendChild(input);
  } else if (q.type === 'textarea') {
    const ta = document.createElement('textarea');
    ta.className = 'textarea-input';
    ta.dataset.colKey = q.colKey;
    ta.dataset.required = 'true';
    if (q.placeholder) ta.placeholder = q.placeholder;
    ta.rows = 5;
    block.appendChild(ta);
  } else if (q.type === 'radio') {
    const group = document.createElement('div');
    group.className = 'radio-group';
    group.dataset.colKey = q.colKey;
    group.dataset.required = 'true';
    group.dataset.qtype = 'radio';
    q.options.forEach(opt => {
      const label = document.createElement('label');
      label.className = 'radio-option';
      label.innerHTML = `<input type="radio" name="${q.id}" value="${esc(opt)}"><span class="radio-dot"></span><span class="option-text">${esc(opt)}</span>`;
      group.appendChild(label);
    });
    block.appendChild(group);
  } else if (q.type === 'checkbox') {
    const group = document.createElement('div');
    group.className = 'checkbox-group';
    group.dataset.colKey = q.colKey;
    group.dataset.required = 'true';
    group.dataset.qtype = 'checkbox';
    q.options.forEach(opt => {
      const label = document.createElement('label');
      label.className = 'checkbox-option';
      label.innerHTML = `<input type="checkbox" name="${q.id}" value="${esc(opt)}"><span class="checkbox-box"></span><span class="option-text">${esc(opt)}</span>`;
      group.appendChild(label);
    });
    block.appendChild(group);
  } else if (q.type === 'scale') {
    const wrap = document.createElement('div');
    wrap.className = 'scale-group';

    const opts = document.createElement('div');
    opts.className = 'scale-options';
    opts.dataset.colKey = q.colKey;
    opts.dataset.required = 'true';
    opts.dataset.qtype = 'scale';

    for (let i = q.scaleMin; i <= q.scaleMax; i++) {
      const opt = document.createElement('div');
      opt.className = 'scale-option';
      opt.dataset.value = i;
      opt.innerHTML = `<span class="scale-num">${i}</span><span class="scale-dot"></span>`;
      opts.appendChild(opt);
    }

    const lblRow = document.createElement('div');
    lblRow.className = 'scale-labels';
    lblRow.innerHTML = `<span>${q.scaleMinLabel}</span><span>${q.scaleMaxLabel}</span>`;

    wrap.appendChild(opts);
    wrap.appendChild(lblRow);
    block.appendChild(wrap);
  }

  return block;
}

// ════════════════════════════════════════════════════════
// UI 이벤트 초기화
// ════════════════════════════════════════════════════════
function initChoiceUI() {
  // 라디오
  document.querySelectorAll('#survey-questions .radio-option input[type="radio"]').forEach(input => {
    input.addEventListener('change', function() {
      const group = this.closest('.radio-group');
      group.querySelectorAll('.radio-option').forEach(o => o.classList.remove('selected'));
      this.closest('.radio-option').classList.add('selected');
      clearError(group.closest('.q-block'));
      updateProgress();
    });
  });

  // 체크박스
  document.querySelectorAll('#survey-questions .checkbox-option input[type="checkbox"]').forEach(input => {
    input.addEventListener('change', function() {
      const opt = this.closest('.checkbox-option');
      if (this.checked) opt.classList.add('checked');
      else opt.classList.remove('checked');
      clearError(opt.closest('.q-block'));
      updateProgress();
    });
  });

  // 척도
  document.querySelectorAll('#survey-questions .scale-option').forEach(opt => {
    opt.addEventListener('click', function() {
      const group = this.closest('.scale-options');
      group.querySelectorAll('.scale-option').forEach(o => o.classList.remove('selected'));
      this.classList.add('selected');
      clearError(group.closest('.q-block'));
      updateProgress();
    });
  });

  // 텍스트/텍스트에리어
  document.querySelectorAll('#survey-questions .text-input, #survey-questions .textarea-input').forEach(el => {
    el.addEventListener('input', function() {
      if (this.value.trim()) clearError(this.closest('.q-block'));
      updateProgress();
    });
  });
}

function initSpecialInputs() {
  // 연락처 자동 하이픈
  document.querySelectorAll('[data-input-type="phone"]').forEach(el => {
    el.addEventListener('keydown', function(e) {
      const allowed = ['Backspace','Delete','ArrowLeft','ArrowRight','Tab','Home','End'];
      if (allowed.includes(e.key) || e.ctrlKey || e.metaKey) return;
      if (!/^\d$/.test(e.key)) e.preventDefault();
    });
    el.addEventListener('input', function() {
      const digits = this.value.replace(/\D/g, '').slice(0, 11);
      let fmt = digits;
      if (digits.length > 7) fmt = digits.slice(0,3) + '-' + digits.slice(3,7) + '-' + digits.slice(7);
      else if (digits.length > 3) fmt = digits.slice(0,3) + '-' + digits.slice(3);
      this.value = fmt;
      updateProgress();
    });
  });

  // 이름 한글 완성자만
  document.querySelectorAll('[data-input-type="name"]').forEach(el => {
    let composing = false;
    el.addEventListener('compositionstart', () => { composing = true; });
    el.addEventListener('compositionend', function() {
      composing = false;
      this.value = this.value.replace(/[^가-힣\s]/g, '');
      updateProgress();
    });
    el.addEventListener('input', function() {
      if (!composing) {
        this.value = this.value.replace(/[^가-힣\s]/g, '');
        updateProgress();
      }
    });
  });
}

function clearError(block) {
  if (block) block.classList.remove('error-field');
}

// ════════════════════════════════════════════════════════
// 진행률 바
// ════════════════════════════════════════════════════════
function updateProgress() {
  const questions = questionsByType[currentType] || [];
  const total = questions.length;
  if (total === 0) return;

  let answered = 0;
  questions.forEach(q => {
    const val = getAnswerValue(q);
    if (val && val.trim()) answered++;
  });

  const pct = Math.round((answered / total) * 100);
  document.getElementById('progress-fill').style.width = pct + '%';
  document.getElementById('progress-label').textContent = answered + ' / ' + total + ' 문항';
}

function getAnswerValue(q) {
  if (q.type === 'radio') {
    const group = document.querySelector(`.radio-group[data-col-key="${q.colKey}"]`);
    if (!group) return '';
    const checked = group.querySelector('input:checked');
    return checked ? checked.value : '';
  }
  if (q.type === 'checkbox') {
    const group = document.querySelector(`.checkbox-group[data-col-key="${q.colKey}"]`);
    if (!group) return '';
    const vals = [...group.querySelectorAll('input:checked')].map(i => i.value);
    return vals.join(',');
  }
  if (q.type === 'scale') {
    const group = document.querySelector(`.scale-options[data-col-key="${q.colKey}"]`);
    if (!group) return '';
    const sel = group.querySelector('.scale-option.selected');
    return sel ? sel.dataset.value : '';
  }
  if (q.type === 'name' || q.type === 'phone' || q.type === 'text') {
    const el = document.querySelector(`input[data-col-key="${q.colKey}"]`);
    return el ? el.value.trim() : '';
  }
  if (q.type === 'textarea') {
    const el = document.querySelector(`textarea[data-col-key="${q.colKey}"]`);
    return el ? el.value.trim() : '';
  }
  return '';
}

// ════════════════════════════════════════════════════════
// 폼 데이터 수집
// ════════════════════════════════════════════════════════
function collectFormData() {
  const typeLabels = { general: '일반사용자', employee: '임직원', partner: '파트너' };
  const data = {
    participantType: typeLabels[currentType] || currentType
  };

  const questions = questionsByType[currentType] || [];
  questions.forEach(q => {
    data[q.colKey] = getAnswerValue(q);
  });

  // name / phone을 최상위 필드로도 저장
  const nameQ = questions.find(q => q.type === 'name');
  const phoneQ = questions.find(q => q.type === 'phone');
  if (nameQ)  data.name  = data[nameQ.colKey]  || '';
  if (phoneQ) data.phone = data[phoneQ.colKey] || '';

  return data;
}

// ════════════════════════════════════════════════════════
// 유효성 검사
// ════════════════════════════════════════════════════════
function validateRequiredAnswers() {
  const questions = questionsByType[currentType] || [];
  const errors = [];

  document.querySelectorAll('.q-block.error-field').forEach(el => el.classList.remove('error-field'));

  questions.forEach(q => {
    if (!q.required) return;
    const val = getAnswerValue(q);
    if (!val || !val.trim()) {
      const block = document.getElementById('qb-' + q.id);
      if (block) block.classList.add('error-field');
      errors.push({ id: 'qb-' + q.id, label: q.title.split('.')[0] });
    }
  });

  // 연락처 형식 검증
  const phoneQ = questions.find(q => q.type === 'phone');
  if (phoneQ) {
    const val = getAnswerValue(phoneQ);
    if (val && !/^010-\d{4}-\d{4}$/.test(val)) {
      const block = document.getElementById('qb-' + phoneQ.id);
      if (block) block.classList.add('error-field');
      if (!errors.find(e => e.id === 'qb-' + phoneQ.id)) {
        errors.push({ id: 'qb-' + phoneQ.id, label: phoneQ.title.split('.')[0] + ' (형식 오류)' });
      }
    }
  }

  return errors;
}

function showValidationToast(errors) {
  const toast = document.getElementById('validation-toast');
  const list  = document.getElementById('toast-list');
  list.innerHTML = '';
  const seen = new Set();
  errors.forEach(err => {
    const qNum = err.label;
    if (seen.has(qNum)) return;
    seen.add(qNum);
    const chip = document.createElement('span');
    chip.className = 'toast-item';
    chip.textContent = qNum;
    chip.addEventListener('click', () => {
      const el = document.getElementById(err.id);
      if (el) el.scrollIntoView({ behavior: 'smooth', block: 'center' });
    });
    list.appendChild(chip);
  });
  toast.classList.add('visible');
}

// ════════════════════════════════════════════════════════
// 제출
// ════════════════════════════════════════════════════════
async function submitSurveyResponse(data) {
  await fetch(SCRIPT_URL, {
    method: 'POST',
    mode: 'no-cors',
    headers: { 'Content-Type': 'text/plain;charset=utf-8' },
    body: JSON.stringify(data)
  });
}

document.getElementById('survey-form').addEventListener('submit', async function(e) {
  e.preventDefault();

  const errors = validateRequiredAnswers();
  const errBox = document.getElementById('error-msg');

  if (errors.length > 0) {
    showValidationToast(errors);
    const firstError = document.querySelector('.q-block.error-field');
    if (firstError) firstError.scrollIntoView({ behavior: 'smooth', block: 'center' });
    return;
  }

  document.getElementById('validation-toast').classList.remove('visible');
  errBox.classList.remove('visible');
  document.getElementById('loading-overlay').classList.add('visible');
  document.getElementById('btn-submit').disabled = true;

  try {
    const data = collectFormData();
    await submitSurveyResponse(data);
    showComplete();
  } catch (err) {
    document.getElementById('loading-overlay').classList.remove('visible');
    document.getElementById('btn-submit').disabled = false;
    errBox.textContent = '일시적인 오류가 발생했습니다. 잠시 후 다시 시도해주세요.';
    errBox.classList.add('visible');
  }
});

function showComplete() {
  document.getElementById('loading-overlay').classList.remove('visible');
  document.getElementById('validation-toast').classList.remove('visible');
  document.getElementById('banner-section').style.display = 'none';
  document.getElementById('survey-page').style.display = 'none';
  document.getElementById('complete-page').style.display = 'block';
  document.getElementById('progress-bar-wrap').style.display = 'none';
  document.getElementById('complete-msg').textContent = completeMessages[currentType] || '';
  window.scrollTo({ top: 0, behavior: 'smooth' });
}

// ════════════════════════════════════════════════════════
// 유틸
// ════════════════════════════════════════════════════════
function esc(str) {
  if (!str) return '';
  return String(str)
    .replace(/&/g,'&amp;')
    .replace(/</g,'&lt;')
    .replace(/>/g,'&gt;')
    .replace(/"/g,'&quot;');
}

// 토스트 닫기
document.getElementById('toast-close-btn').addEventListener('click', () => {
  document.getElementById('validation-toast').classList.remove('visible');
});

// 모달 배경 클릭 닫기
document.getElementById('code-modal-overlay').addEventListener('click', function(e) {
  if (e.target === this) closeCodeModal();
});

// ════════════════════════════════════════════════════════
// 초기화
// ════════════════════════════════════════════════════════
init();
</script>
